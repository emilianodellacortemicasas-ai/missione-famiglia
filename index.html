<style>
  /* ============ TOKENS ============ */
  :root{
    --bg:#F5F3FB;
    --surface:#FFFFFF;
    --surface-2:#EDEAF8;
    --surface-3:#E3E0F4;
    --ink:#251F3A;
    --ink-soft:#6C6584;
    --ink-faint:#9891AC;
    --border:#E1DDF2;
    --primary:#6C5CE7;
    --primary-ink:#FFFFFF;
    --primary-soft:#EEEBFC;
    --primary-deep:#5142C4;
    --star:#FFB020;
    --star-deep:#B97300;
    --star-soft:#FFF1D9;
    --good:#1FA97F;
    --good-soft:#DFF6EE;
    --warn:#F2994A;
    --warn-soft:#FDEEDD;
    --warm:#FF7A59;
    --warm-soft:#FFE9E2;
    --danger:#E85D5D;
    --danger-soft:#FBE4E4;
    --bg-wash-1: rgba(108,92,231,.08);
    --bg-wash-2: rgba(255,176,32,.10);
    --shadow-1: 0 1px 2px rgba(37,31,58,.06), 0 1px 1px rgba(37,31,58,.04);
    --shadow-2: 0 8px 24px rgba(37,31,58,.10), 0 2px 6px rgba(37,31,58,.06);
    --shadow-3: 0 20px 48px rgba(37,31,58,.20);
    --radius-s: 10px;
    --radius-m: 16px;
    --radius-l: 22px;
    --radius-xl: 28px;
    --font-display:'Baloo 2', 'Segoe UI Rounded', system-ui, sans-serif;
    --font-body:'Figtree', system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1730;
      --surface:#241F3D;
      --surface-2:#2C2649;
      --surface-3:#352E58;
      --ink:#F1EEFB;
      --ink-soft:#B8B2D4;
      --ink-faint:#8A82AC;
      --border:#3B335E;
      --primary:#8B7CF3;
      --primary-ink:#1B1730;
      --primary-soft:#332C58;
      --primary-deep:#A79AF6;
      --star:#FFC24D;
      --star-deep:#FFD98A;
      --star-soft:#3D3120;
      --good:#3FCB9C;
      --good-soft:#1B3C31;
      --warn:#FFA85C;
      --warn-soft:#3E2C1B;
      --warm:#FF9078;
      --warm-soft:#3E2721;
      --danger:#F17A7A;
      --danger-soft:#3E2323;
      --bg-wash-1: rgba(139,124,243,.16);
      --bg-wash-2: rgba(255,194,77,.10);
      --shadow-1: 0 1px 2px rgba(0,0,0,.3);
      --shadow-2: 0 8px 24px rgba(0,0,0,.35);
      --shadow-3: 0 20px 48px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1730;
    --surface:#241F3D;
    --surface-2:#2C2649;
    --surface-3:#352E58;
    --ink:#F1EEFB;
    --ink-soft:#B8B2D4;
    --ink-faint:#8A82AC;
    --border:#3B335E;
    --primary:#8B7CF3;
    --primary-ink:#1B1730;
    --primary-soft:#332C58;
    --primary-deep:#A79AF6;
    --star:#FFC24D;
    --star-deep:#FFD98A;
    --star-soft:#3D3120;
    --good:#3FCB9C;
    --good-soft:#1B3C31;
    --warn:#FFA85C;
    --warn-soft:#3E2C1B;
    --warm:#FF9078;
    --warm-soft:#3E2721;
    --danger:#F17A7A;
    --danger-soft:#3E2323;
    --bg-wash-1: rgba(139,124,243,.16);
    --bg-wash-2: rgba(255,194,77,.10);
    --shadow-1: 0 1px 2px rgba(0,0,0,.3);
    --shadow-2: 0 8px 24px rgba(0,0,0,.35);
    --shadow-3: 0 20px 48px rgba(0,0,0,.5);
  }

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:
      radial-gradient(720px 480px at 12% -8%, var(--bg-wash-1), transparent 60%),
      radial-gradient(640px 420px at 108% 12%, var(--bg-wash-2), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--font-body); font-size:15.5px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{ font-family:var(--font-display); font-weight:700; margin:0; text-wrap:balance; color:var(--ink); }
  p{margin:0}
  button{font-family:inherit; font-size:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:inherit;}
  a{color:inherit}
  ::selection{ background:var(--primary); color:var(--primary-ink); }
  .num{ font-variant-numeric:tabular-nums; }
  [hidden]{display:none!important}
  :focus-visible{ outline:3px solid var(--primary); outline-offset:2px; border-radius:6px; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
  }

  /* ============ SHELL ============ */
  #app{ min-height:100vh; display:flex; flex-direction:column; }
  .topbar{
    position:sticky; top:0; z-index:30;
    display:flex; align-items:center; gap:12px;
    padding:12px 16px; background:var(--surface);
    border-bottom:1px solid var(--border);
  }
  .topbar .brand{ display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:1.05rem; }
  .brand-badge{ width:34px; height:34px; border-radius:11px; background:linear-gradient(155deg,var(--primary),var(--primary-deep)); display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:var(--shadow-1); flex:none; }
  .brand-badge .star-ico{ width:18px; height:18px; filter:none; }
  .topbar-spacer{ flex:1; }
  .icon-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    width:40px; height:40px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); color:var(--ink-soft); font-size:18px;
  }
  .icon-btn:hover{ background:var(--surface-2); }
  .pill-btn{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); padding:8px 14px; border-radius:999px;
    font-weight:600; font-size:.88rem;
  }
  .pill-btn:hover{ background:var(--surface-2); }

  main{ flex:1; width:100%; max-width:1080px; margin:0 auto; padding:18px 16px 100px; }
  @media (min-width:720px){ main{ padding:28px 24px 60px; } }

  .bottom-nav{
    position:sticky; bottom:0; z-index:30; display:flex; background:var(--surface);
    border-top:1px solid var(--border); padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    gap:2px;
  }
  .bottom-nav button{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    background:none; border:none; color:var(--ink-faint); padding:8px 4px 6px; border-radius:12px;
    font-size:.72rem; font-weight:700;
  }
  .bottom-nav button .ico{ font-size:20px; }
  .bottom-nav button.active{ color:var(--primary); background:var(--primary-soft); }
  @media (min-width:720px){ .bottom-nav{ display:none; } }

  .side-tabs{ display:none; }
  @media (min-width:720px){
    .side-tabs{
      display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px; border-bottom:1px solid var(--border); padding-bottom:14px;
    }
    .side-tabs button{
      background:var(--surface); border:1px solid var(--border); color:var(--ink-soft);
      padding:9px 16px; border-radius:999px; font-weight:700; font-size:.86rem; display:flex; align-items:center; gap:7px;
    }
    .side-tabs button.active{ background:var(--primary); color:var(--primary-ink); border-color:var(--primary); }
    .side-tabs button:hover:not(.active){ background:var(--surface-2); }
  }

  /* ============ COMPONENTS ============ */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l);
    padding:18px; box-shadow:var(--shadow-1);
  }
  .grid{ display:grid; gap:14px; }
  .grid-2{ grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
  .grid-3{ grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }
  .stack{ display:flex; flex-direction:column; gap:14px; }
  .row{ display:flex; align-items:center; gap:10px; }
  .row-between{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .wrap{ flex-wrap:wrap; }

  .section-title{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; }
  .section-title h2{ font-size:1.15rem; }
  .eyebrow{ text-transform:uppercase; letter-spacing:.09em; font-size:.72rem; font-weight:800; color:var(--ink-faint); }

  .avatar{
    width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:22px; flex:none; box-shadow:inset 0 0 0 2px rgba(255,255,255,.5);
  }
  .avatar.lg{ width:76px; height:76px; font-size:38px; }
  .avatar.xl{ width:108px; height:108px; font-size:54px; }

  .star-chip{
    display:inline-flex; align-items:center; gap:5px; background:var(--star-soft);
    color:var(--star-deep); box-shadow:var(--shadow-1);
    padding:6px 12px; border-radius:999px; font-family:var(--font-display); font-weight:700; font-size:.95rem;
  }
  .star-chip.lg{ font-size:1.5rem; padding:10px 18px; gap:8px; }
  .star-chip .s{ font-size:1.1em; display:inline-flex; }
  .star-ico{ width:1em; height:1em; display:inline-block; vertical-align:-0.14em; filter:drop-shadow(0 1px 0 rgba(0,0,0,.08)); }
  .hero-deco{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  .hero-star{ position:absolute; color:var(--star); }
  .hero-star .star-ico{ width:100%; height:100%; filter:none; }

  .badge{
    display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:999px;
    font-size:.76rem; font-weight:800; letter-spacing:.01em;
  }
  .badge.todo{ background:var(--surface-3); color:var(--ink-soft); }
  .badge.pending{ background:var(--warn-soft); color:var(--warn); }
  .badge.approved{ background:var(--good-soft); color:var(--good); }
  .badge.postponed{ background:var(--surface-3); color:var(--ink-faint); }
  .badge.requested{ background:var(--warn-soft); color:var(--warn); }
  .badge.rejected{ background:var(--danger-soft); color:var(--danger); }
  .badge.cancelled{ background:var(--surface-3); color:var(--ink-faint); }
  .badge.used{ background:var(--primary-soft); color:var(--primary-deep); }
  .badge.team{ background:var(--warm-soft); color:var(--warm); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    border:none; border-radius:var(--radius-s); padding:11px 18px; font-weight:700; font-size:.92rem;
    background:var(--surface-2); color:var(--ink);
  }
  .btn:hover{ filter:brightness(1.03); }
  .btn:active{ transform:translateY(1px); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn.primary{ background:var(--primary); color:var(--primary-ink); box-shadow:var(--shadow-1); }
  .btn.good{ background:var(--good); color:#fff; }
  .btn.warn{ background:var(--warn); color:#fff; }
  .btn.danger{ background:var(--danger); color:#fff; }
  .btn.ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--border); }
  .btn.block{ width:100%; }
  .btn.sm{ padding:8px 13px; font-size:.82rem; border-radius:9px; }

  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:.82rem; font-weight:700; color:var(--ink-soft); }
  .field input[type=text],.field input[type=number],.field input[type=password],
  .field input[type=date],.field select,.field textarea{
    background:var(--surface-2); border:1.5px solid transparent; border-radius:var(--radius-s);
    padding:11px 12px; color:var(--ink); width:100%;
  }
  .field input:focus,.field select:focus,.field textarea:focus{ border-color:var(--primary); background:var(--surface); }
  .field textarea{ resize:vertical; min-height:64px; }
  .field .hint{ font-size:.76rem; color:var(--ink-faint); }
  .checkrow{ display:flex; align-items:center; gap:9px; font-size:.88rem; font-weight:600; }
  .checkrow input{ width:18px; height:18px; accent-color:var(--primary); }
  .daychips{ display:flex; gap:6px; flex-wrap:wrap; }
  .daychip{
    width:38px; height:38px; border-radius:50%; border:1.5px solid var(--border); background:var(--surface);
    color:var(--ink-soft); font-weight:800; font-size:.78rem; display:flex; align-items:center; justify-content:center;
  }
  .daychip.on{ background:var(--primary); border-color:var(--primary); color:var(--primary-ink); }

  .mission-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
    padding:15px 16px; box-shadow:var(--shadow-1); display:flex; flex-direction:column; gap:10px;
    transition:box-shadow .18s ease, transform .18s ease;
  }
  .mission-card.is-approved{ background:var(--good-soft); border-color:transparent; }
  .mission-card.pop{ animation:popIn .5s cubic-bezier(.2,1.4,.4,1); }
  @keyframes popIn{ 0%{ transform:scale(.94); } 45%{ transform:scale(1.02); } 100%{ transform:scale(1); } }

  .empty{
    text-align:center; padding:40px 20px; color:var(--ink-faint);
  }
  .empty .emoji{ font-size:2.4rem; display:block; margin-bottom:10px; }

  .toast-stack{ position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; width:min(92vw,420px); }
  .toast{
    background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:999px; font-weight:700; font-size:.86rem;
    box-shadow:var(--shadow-3); display:flex; align-items:center; gap:8px; animation:toastIn .25s ease;
  }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(-10px);} to{opacity:1; transform:translateY(0);} }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(20,16,36,.5); backdrop-filter:blur(2px); z-index:100;
    display:flex; align-items:flex-end; justify-content:center; padding:0;
  }
  @media (min-width:640px){ .modal-backdrop{ align-items:center; padding:20px; } }
  .modal{
    background:var(--surface); width:100%; max-width:560px; max-height:92vh; overflow-y:auto;
    border-radius:22px 22px 0 0; box-shadow:var(--shadow-3); padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    animation:modalUp .22s ease;
  }
  @media (min-width:640px){ .modal{ border-radius:var(--radius-xl); } }
  @keyframes modalUp{ from{ transform:translateY(24px); opacity:.6; } to{ transform:translateY(0); opacity:1; } }
  .modal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px; }
  .modal-head h3{ font-size:1.2rem; }

  .selector-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-xl);
    padding:26px 20px; display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center;
    box-shadow:var(--shadow-1);
  }
  .selector-card:hover{ box-shadow:var(--shadow-2); transform:translateY(-2px); }
  .selector-card{ transition:box-shadow .18s ease, transform .18s ease; }

  .progress-track{ height:12px; border-radius:999px; background:var(--surface-3); overflow:hidden; }
  .progress-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg,var(--star),var(--warm)); transition:width .4s ease; }

  table{ width:100%; border-collapse:collapse; font-size:.88rem; }
  th{ text-align:left; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); padding:8px 10px; border-bottom:1px solid var(--border); }
  td{ padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
  .table-wrap{ overflow-x:auto; }

  .lock-screen{ position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:70vh; gap:18px; text-align:center; padding:20px; }
  .lock-screen > *{ position:relative; z-index:1; }
  .pin-dots{ display:flex; gap:12px; }
  .pin-dot{ width:16px; height:16px; border-radius:50%; border:2px solid var(--border); }
  .pin-dot.filled{ background:var(--primary); border-color:var(--primary); }
  .keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:min(280px,80vw); }
  .keypad button{ aspect-ratio:1; border-radius:50%; border:1px solid var(--border); background:var(--surface); font-size:1.3rem; font-weight:700; font-family:var(--font-display); }
  .keypad button:active{ background:var(--surface-2); }

  .wheel-wrap{ display:flex; flex-direction:column; align-items:center; gap:22px; }
  .wheel-holder{ position:relative; width:min(320px,80vw); aspect-ratio:1; }
  .wheel-pointer{ position:absolute; top:-6px; left:50%; transform:translateX(-50%); font-size:30px; z-index:5; filter:drop-shadow(0 3px 3px rgba(0,0,0,.25)); }
  .wheel-svg{ width:100%; height:100%; transition:transform 2.6s cubic-bezier(.12,.66,.15,1); border-radius:50%; box-shadow:var(--shadow-3); }
  .wheel-hub{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:22%; height:22%; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:22px; box-shadow:var(--shadow-2); border:3px solid var(--surface); }

  .confetti-layer{ position:fixed; inset:0; pointer-events:none; z-index:150; overflow:hidden; }
  .confetti-piece{ position:absolute; top:-10px; border-radius:2px; animation:confettiFall linear forwards; }
  @keyframes confettiFall{ to{ transform:translateY(105vh) rotate(540deg); opacity:.2; } }

  .swatch{ width:34px; height:34px; border-radius:50%; border:2px solid transparent; }
  .swatch.on{ border-color:var(--ink); box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
  .emoji-pick{ font-size:22px; width:44px; height:44px; border-radius:12px; border:1.5px solid var(--border); background:var(--surface); }
  .emoji-pick.on{ border-color:var(--primary); background:var(--primary-soft); }

  .encourage{
    background:linear-gradient(135deg,var(--primary-soft),var(--surface)); border:1px solid var(--border);
    border-radius:var(--radius-l); padding:16px 18px; display:flex; gap:12px; align-items:center;
  }
  .kicker-btn{ background:none; border:none; color:var(--primary); font-weight:700; font-size:.86rem; padding:4px 0; }
  .link-btn{ background:none; border:none; color:var(--ink-faint); font-weight:600; font-size:.8rem; text-decoration:underline; padding:2px; }

  .loading-screen{ display:flex; align-items:center; justify-content:center; min-height:100vh; flex-direction:column; gap:14px; color:var(--ink-soft); }
  .spinner{ width:34px; height:34px; border-radius:50%; border:3px solid var(--surface-3); border-top-color:var(--primary); animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>

</head>
<body>
<div id="app"><div class="loading-screen"><div class="spinner"></div><p>Sto preparando Missione Famiglia…</p></div></div>
<div class="toast-stack" id="toastStack"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   UTILITIES
   ============================================================ */
const TZ = 'Europe/Rome';
function todayStr(){
  return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
}
function nowIso(){ return new Date().toISOString(); }
function toRomeDate(iso){
  if(!iso) return '';
  return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(iso));
}
function weekdayIdx(dateStr){ // 0=Dom..6=Sab (getDay) using noon anchor to dodge DST edges
  return new Date(dateStr+'T12:00:00').getDay();
}

function isoWeekKey(dateStr){
  const d = new Date(dateStr+'T12:00:00');
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (dt.getUTCDay()+6)%7;
  dt.setUTCDate(dt.getUTCDate()-dayNum+3);
  const firstThursday = new Date(Date.UTC(dt.getUTCFullYear(),0,4));
  const week = 1 + Math.round(((dt-firstThursday)/86400000 - 3 + ((firstThursday.getUTCDay()+6)%7))/7);
  return dt.getUTCFullYear()+'-W'+String(week).padStart(2,'0');
}
function addDays(dateStr,n){
  const d = new Date(dateStr+'T12:00:00'); d.setDate(d.getDate()+n);
  return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
}
function isoWeekStart(dateStr){
  // Monday of the week containing dateStr (Rome calendar week)
  const idx = weekdayIdx(dateStr); // 0=Dom..6=Sab
  const offset = idx===0 ? -6 : 1-idx;
  return addDays(dateStr, offset);
}

function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h<<5)-h+s.charCodeAt(i); h|=0; } return Math.abs(h); }
async function sha256Hex(str){

let sbClient = null;
let sbChannelSeq = 0;

function sbRowToDocSnap(id, row){
  return {
    exists: !!row,
    id: id,
    data: ()=> row ? row.data : undefined,
  };
}

function docRef(path){
  const parts = path.split('/');
  const table = TABLE_MAP[parts[0]];
  const id = parts[1];
  return {
    async get(){
      const { data, error } = await sbClient.from(table).select('*').eq('id', id).maybeSingle();
      if(error) throw error;
      return sbRowToDocSnap(id, data);
    },
    async set(value){
      const { error } = await sbClient.from(table).upsert({ id, data: value, updated_at: new Date().toISOString() });
      if(error) throw error;
    },
    async update(value){
      const { data: cur, error: e1 } = await sbClient.from(table).select('data').eq('id', id).maybeSingle();
      if(e1) throw e1;
      const merged = Object.assign({}, cur ? cur.data : {}, value);
      const { error } = await sbClient.from(table).upsert({ id, data: merged, updated_at: new Date().toISOString() });
      if(error) throw error;
    },
    async delete(){
      const { error } = await sbClient.from(table).delete().eq('id', id);
      if(error) throw error;
    },
    onSnapshot(cb, errCb){
      (async ()=>{
        try{
          const { data, error } = await sbClient.from(table).select('*').eq('id', id).maybeSingle();
          if(error){ errCb && errCb(error); return; }
          cb(sbRowToDocSnap(id, data));
        }catch(e){ errCb && errCb(e); }
      })();
      const refresh = async ()=>{
        try{
          const { data, error } = await sbClient.from(table).select('*').eq('id', id).maybeSingle();
          if(error){ errCb && errCb(error); return; }
          cb(sbRowToDocSnap(id, data));
        }catch(e){ errCb && errCb(e); }
      };
      const channel = sbClient.channel('doc-'+table+'-'+id+'-'+(sbChannelSeq++))
        .on('postgres_changes', { event:'*', schema:'public', table, filter:'id=eq.'+id }, refresh)
        .subscribe();
      return ()=> sbClient.removeChannel(channel);
    },
    // Lightweight lease: an atomic first-insert wins; a stale lease (older
    // than ttlMs) can be stolen via compare-and-swap on updated_at. Used
    // once, at first boot, to make default-data seeding idempotent even if
    // two devices open the empty app at the same moment.
    async acquire({ holder, ttlMs }){
      const nowIso2 = new Date().toISOString();
      const { error: insErr } = await sbClient.from(table).insert({ id, data: { __lease: holder, __leaseAt: Date.now() }, updated_at: nowIso2 });
      if(!insErr) return { acquired: true };
      const { data: cur } = await sbClient.from(table).select('data, updated_at').eq('id', id).maybeSingle();
      if(!cur) return { acquired: false };
      const isLease = cur.data && cur.data.__lease;
      if(!isLease) return { acquired: false };
      const age = Date.now() - new Date(cur.updated_at).getTime();
      if(age < ttlMs) return { acquired: false };
      const { data: stolen, error: casErr } = await sbClient.from(table)
        .update({ data: { __lease: holder, __leaseAt: Date.now() }, updated_at: nowIso2 })
        .eq('id', id).eq('updated_at', cur.updated_at).select('id');
      if(casErr || !stolen || stolen.length===0) return { acquired: false };
      return { acquired: true };
    },
  };
}

function colRef(path){
  const table = TABLE_MAP[path];
  return {
    async add(value){
      const id = uid();
      const { error } = await sbClient.from(table).insert({ id, data: value, updated_at: new Date().toISOString() });
      if(error) throw error;
      return { id };
    },
    onSnapshot(cb, errCb){
      const fetchAll = async ()=>{
        try{
          const { data, error } = await sbClient.from(table).select('*').order('updated_at', { ascending:true });
          if(error){ errCb && errCb(error); return; }
          cb({ docs: data.map(r=>({ id:r.id, data:()=> r.data })) });
        }catch(e){ errCb && errCb(e); }
      };
      fetchAll();
      const channel = sbClient.channel('col-'+table+'-'+(sbChannelSeq++))
        .on('postgres_changes', { event:'*', schema:'public', table }, fetchAll)
        .subscribe();
      return ()=> sbClient.removeChannel(channel);
    },
  };
}

   ============================================================ */
function childById(id){ return S.children.find(c=>c.id===id); }
function missionById(id){ return S.missions.find(m=>m.id===id); }
function rewardById(id){ return S.rewards.find(r=>r.id===id); }
function instanceById(id){ return S.missionInstances.find(i=>i.id===id); }

function isMissionSuspended(m, dateStr){
  const s = m.suspension;
  if(!s || !s.active) return false;
  if(s.until && dateStr > s.until) return false;
  return true;
}

function missionOccursToday(m, dateStr){
  if(!m.active) return false;
  if(isMissionSuspended(m, dateStr)) return false;
  if(m.frequency==='daily'){
    if(!m.daysOfWeek || m.daysOfWeek.length===0) return true;
    return m.daysOfWeek.includes(weekdayIdx(dateStr));
  }
  return false; // weekly & occasional handled separately
}

function instId(missionId, childId, dateStr){ return missionId+'__'+childId+'__'+dateStr; }
function instIdWeek(missionId, childId, weekKey){ return missionId+'__'+childId+'__'+weekKey; }

// Returns the list of "today" mission cards (virtual or real) for a child
function todaysMissionsFor(childId){
  const today = todayStr();
  const week = isoWeekKey(today);
  const out = [];
  for(const m of S.missions){
    if(!m.active) continue;
    if(!(m.assignedTo||[]).includes(childId)) continue;
    if(m.frequency==='daily' && missionOccursToday(m, today)){
      const id = instId(m.id, childId, today);
      const inst = instanceById(id);
      if(!inst || inst.status!=='approved'){
        out.push({ key:id, mission:m, instance:inst||null, period:'oggi', dateStr:today });
      }
    } else if(m.frequency==='weekly' && !isMissionSuspended(m,today)){
      const id = instIdWeek(m.id, childId, week);
      const inst = instanceById(id);
      if(!inst || inst.status!=='approved'){
        out.push({ key:id, mission:m, instance:inst||null, period:'questa settimana', dateStr:today });
      }
    }
  }
  // occasional: any outstanding instance not approved, regardless of date
  for(const inst of S.missionInstances){
    if(inst.childId!==childId) continue;
    const m = missionById(inst.missionId);
    if(!m || m.frequency!=='occasional' || !m.active) continue;
    if(inst.status==='approved') continue;
    out.push({ key:inst.id, mission:m, instance:inst, period:'assegnata', dateStr:inst.date });
  }
  out.sort((a,b)=> (a.mission.order??0)-(b.mission.order??0));
  return out;
}

function recentlyApprovedFor(childId){
  const today = todayStr();
  return S.missionInstances.filter(i=> i.childId===childId && i.status==='approved' && toRomeDate(i.approvedAt)===today)
    .map(i=>({instance:i, mission:missionById(i.missionId)})).filter(x=>x.mission);
}

function starBalance(childId){
  let bal = 0;
  for(const l of S.ledgerEntries){ if(l.childId===childId) bal += l.amount; }
  return bal;
}
// Stars EARNED (missioni approvate) nella settimana corrente — obiettivo personale, mai confrontato tra sorelle.
function weeklyStarsEarned(childId, dateStr){
  const today = dateStr || todayStr();
  const start = isoWeekStart(today);
  let sum = 0;
  for(const l of S.ledgerEntries){
    if(l.childId!==childId || l.type!=='earned') continue;
    const d = toRomeDate(l.createdAt);
    if(d>=start && d<=today) sum += l.amount;
  }
  return sum;
}
function reservedStars(childId, excludeRequestId){
  let r=0;
  for(const req of S.rewardRequests){
    if(req.childId===childId && req.status==='requested' && req.id!==excludeRequestId) r += req.cost;
  }
  return r;
}
function availableStars(childId, excludeRequestId){
  return starBalance(childId) - reservedStars(childId, excludeRequestId);
}

function activeSpinFor(childId){
  return S.wheelSpins.find(s=>s.childId===childId && !['completed','cancelled'].includes(s.status))
    || S.wheelSpins.slice().reverse().find(s=>s.childId===childId && s.status==='completed' && sameDay(s.completedMarkedAt||s.confirmedAt));
}
function sameDay(iso){ if(!iso) return false; return toRomeDate(iso)===todayStr(); }

function teamProgress(){
  let sum = 0;
  for(const c of S.teamContributions){ sum += (c.points||0); }
  return sum;
}

  if(!S.meta || !S.meta.parentPinHash) return false;
  const hash = await sha256Hex(S.meta.parentPinSalt+':'+pin);
  return hash === S.meta.parentPinHash;
}

const _inFlightRequests = new Set();
async function requestReward(reward, childId){
  const lockKey = childId+'__'+reward.id;
  if(_inFlightRequests.has(lockKey)) return; // guard against double-tap creating duplicate requests
  _inFlightRequests.add(lockKey);
  try{
    const avail = availableStars(childId);
    if(reward.cost > avail){ toast('Stelle non sufficienti per questo premio.', '⚠️'); return; }
    await col('rewardRequests').add({
      rewardId:reward.id, rewardTitle:reward.title, cost:reward.cost, childId,
      status:'requested', requestedAt:nowIso(), decidedAt:null, decidedBy:null, note:'', scheduledFor:null, usedAt:null
    });
    toast('Richiesta inviata ai genitori!', '🎁');
  } finally {
    setTimeout(()=>_inFlightRequests.delete(lockKey), 1500);
  }
}
async function cancelRequest(req){
  if(req.status!=='requested') return;
  await doc('rewardRequests/'+req.id).update({status:'cancelled', decidedAt:nowIso(), decidedBy:req.childId});
}
async function decideRequest(req, approve, note){
  if(req.status!=='requested') return;
  if(approve){
    await doc('rewardRequests/'+req.id).update({status:'approved', decidedAt:nowIso(), decidedBy:'genitore', note:note||''});
    await doc('ledgerEntries/spend_'+req.id).set({
      id:'spend_'+req.id, childId:req.childId, type:'spent', amount:-req.cost,
      reason:'Premio: '+req.rewardTitle, rewardRequestId:req.id, createdAt:nowIso(), createdBy:'genitore'
    });
  } else {
    await doc('rewardRequests/'+req.id).update({status:'rejected', decidedAt:nowIso(), decidedBy:'genitore', note:note||''});
  }
}
async function cancelApprovedRequest(req, reason){
  if(req.status!=='approved') return;
  await doc('rewardRequests/'+req.id).update({status:'cancelled', decidedAt:nowIso(), decidedBy:'genitore', note:reason||''});
  await doc('ledgerEntries/refund_'+req.id).set({
    id:'refund_'+req.id, childId:req.childId, type:'refund', amount:req.cost,
    reason:'Rimborso: '+req.rewardTitle, rewardRequestId:req.id, createdAt:nowIso(), createdBy:'genitore'
  });
}

async function createSpin(childId, poolIds){
  // one active spin per child at a time
  const active = S.wheelSpins.find(s=>s.childId===childId && !['completed','cancelled'].includes(s.status));
  if(active) return active.id;
  const ref = await col('wheelSpins').add({
    childId, poolChallengeIds:poolIds, status:'ready_to_spin',
    resultChallengeId:null, resultText:'', createdAt:nowIso(), createdBy:'genitore',
    spunAt:null, completedMarkedAt:null, confirmedAt:null, note:''
  });
  return ref.id;
}
async function performSpin(spin){
  if(spin.status!=='ready_to_spin') return;
  const pool = spin.poolChallengeIds.map(id=>S.wheelChallenges.find(c=>c.id===id)).filter(Boolean);
  if(pool.length===0) return;
  const chosen = pool[Math.floor(Math.random()*pool.length)];
  const isJoker = !!chosen.isJoker;
  await doc('wheelSpins/'+spin.id).update({
    status: isJoker ? 'completed' : 'spun',
    resultChallengeId: chosen.id, resultText: chosen.text, resultIsJoker: isJoker, spunAt: nowIso(),
    completedMarkedAt: isJoker ? nowIso() : null, confirmedAt: isJoker ? nowIso() : null
  });
  return chosen;
}

let uiState = { route:[], activeChildTab:{} };

function render(){
  const app = document.getElementById('app');
  if(!dbReady){
    app.innerHTML = `<div class="loading-screen"><div class="spinner"></div><p>Impossibile collegarsi al database di questa pagina.<br>Riprova ricaricando la pagina.</p></div>`;
    return;
  }
  if(!S.meta){
    app.innerHTML = `<div class="loading-screen"><div class="spinner"></div><p>Sto preparando Missione Famiglia…</p></div>`;
    return;
  }
  const route = getRoute();
  let body = '';
  let showTop = true, topTitle = 'Missione Famiglia', topBack = null;

  if(route.length===0){
    body = renderSelector();
    topTitle = 'Missione Famiglia';
  } else if(route[0]==='child' && route[1]){
    const child = childById(route[1]);
    if(!child){ location.hash=''; return; }
    const tab = route[2] || 'home';
    topTitle = child.name;
    topBack = '#/';
    body = renderChildScreen(child, tab);
  } else if(route[0]==='parent'){
    topTitle = 'Area Genitori';
    topBack = '#/';
    if(!parentUnlocked){
      body = renderParentLock();
    } else {
      const tab = route[1] || 'inbox';
      body = renderParentScreen(tab);
    }
  } else {
    body = renderSelector();
  }

  app.innerHTML = `
    <div class="topbar">
      ${topBack ? `<button class="icon-btn" id="backBtn" aria-label="Indietro">←</button>` : `<div class="brand-badge">${starIcon()}</div>`}
      <div class="brand">${escapeHtml(topTitle)}</div>
      <div class="topbar-spacer"></div>
      ${route[0]!=='parent' ? `<a class="pill-btn" href="#/parent">🔒 Genitori</a>` : ''}
    </div>
    <main id="mainArea">${body}</main>
    ${route[0]==='child' && route[1] ? renderBottomNav(route[1], route[2]||'home') : ''}
  `;
  const back = document.getElementById('backBtn');
  if(back) back.addEventListener('click', ()=>{ history.back(); setTimeout(()=>{ if(getRoute().join('/')===route.join('/')) location.hash=''; }, 60); });

  wireScreenEvents(route);
}

      <div class="row-between">
        <strong style="font-size:1.02rem">${escapeHtml(x.mission.title)}</strong>

function badgeFor(status){
  const map = { todo:['da fare','todo'], pending:['in attesa di conferma','pending'], approved:['approvata','approved'], postponed:['rimandata','postponed'] };
  const [label,cls] = map[status]||['','todo'];
  return `<span class="badge ${cls}">${label}</span>`;
}

function renderWheelSvg(pool, rotation, id){
  const n = Math.max(pool.length,1);
  const colors = ['#6C5CE7','#FF7A59','#FFC845','#43C6AC','#4FA8E0','#F06AA0','#5CD17E','#B084F0'];
  const cx=100, cy=100, r=98;
  let paths='';
  for(let i=0;i<n;i++){
    const a0 = (i/n)*2*Math.PI - Math.PI/2;
    const a1 = ((i+1)/n)*2*Math.PI - Math.PI/2;
    const x0 = cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
    const x1 = cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const large = (a1-a0)>Math.PI?1:0;
    paths += `<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${colors[i%colors.length]}" stroke="#fff" stroke-width="2"/>`;
    const mid = (a0+a1)/2;
    const tx = cx+ (r*0.62)*Math.cos(mid), ty = cy+(r*0.62)*Math.sin(mid);
    const label = pool[i] ? (pool[i].isJoker?'🃏':'✦') : '';
    paths += `<text x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#fff">${label}</text>`;
  }
  return `<div class="wheel-holder"><div class="wheel-pointer">📍</div>
    <svg class="wheel-svg" id="${id}" viewBox="0 0 200 200" style="transform:rotate(${rotation}deg)">${paths}</svg>
    <div class="wheel-hub">🎡</div>
  </div>`;
}

/* ============================================================
   EVENT WIRING
   ============================================================ */
function wireScreenEvents(route){
  const main = document.getElementById('mainArea');
  if(!main) return;

  main.addEventListener('click', async (e)=>{
    const t = e.target.closest('[data-select-child],[data-nav],[data-mark-done],[data-fav],[data-request-reward],[data-cancel-request],[data-spin],[data-spin-done],[data-spin-alt],[data-team-done],[data-approve],[data-postpone],[data-approve-reward],[data-reject-reward],[data-confirm-team],[data-confirm-spin],[data-spin-reset],[data-spin-pick],[data-new-mission],[data-edit-mission],[data-delete-mission],[data-suspend-mission],[data-assign-occasional],[data-new-reward],[data-edit-reward],[data-toggle-reward],[data-delete-reward],[data-new-child],[data-edit-child],[data-open-correction],[data-new-wheel],[data-edit-wheel],[data-delete-wheel],[data-edit-team],[data-manual-contrib],[data-change-pin],[data-lock-now],[data-pinkey],[data-ptab],[data-activate-wheel-goal]');
    if(!t) return;

    if(t.dataset.selectChild){ location.hash = '#/child/'+t.dataset.selectChild; return; }
    if(t.dataset.nav){ location.hash = '#/child/'+route[1]+'/'+(t.dataset.nav==='home'?'':t.dataset.nav); return; }
    if(t.dataset.ptab){ location.hash = '#/parent/'+t.dataset.ptab; return; }

    if(t.dataset.markDone!==undefined && t.hasAttribute('data-mark-done')){
      const m = missionById(t.dataset.missionId);
      await markMissionDone(m, t.dataset.childId, t.dataset.date, t.dataset.week);
      return;
    }
    if(t.dataset.fav){ await toggleFavorite(route[1], t.dataset.fav); return; }
    if(t.dataset.requestReward){ await requestReward(rewardById(t.dataset.requestReward), route[1]); return; }
    if(t.dataset.cancelRequest){ await cancelRequest(S.rewardRequests.find(r=>r.id===t.dataset.cancelRequest)); return; }
    if(t.dataset.spin){ await handleSpinClick(t.dataset.spin, t); return; }
    if(t.dataset.spinDone){ await markSpinDone(S.wheelSpins.find(s=>s.id===t.dataset.spinDone)); return; }
    if(t.dataset.spinAlt){ openAltModal(t.dataset.spinAlt); return; }
    if(t.dataset.teamDone!==undefined && t.hasAttribute('data-team-done')){ await markTeamPart(route[1]); return; }

    if(t.dataset.approve){ await approveInstance(instanceById(t.dataset.approve)); celebrateAndToast(); return; }
    if(t.dataset.postpone){ openPostponeModal(t.dataset.postpone); return; }
    if(t.dataset.approveReward){ await decideRequest(S.rewardRequests.find(r=>r.id===t.dataset.approveReward), true); toast('Premio approvato!','🎉'); return; }
    if(t.dataset.rejectReward){ openRejectRewardModal(t.dataset.rejectReward); return; }
    if(t.dataset.confirmTeam){ await confirmTeamInstance(S.teamInstances.find(x=>x.id===t.dataset.confirmTeam)); toast('Progresso di squadra aggiornato!','🤝'); return; }
    if(t.dataset.confirmSpin){ await confirmSpin(S.wheelSpins.find(s=>s.id===t.dataset.confirmSpin)); toast('Prova confermata!','🎉'); return; }
    if(t.dataset.spinReset){ await resetSpin(S.wheelSpins.find(s=>s.id===t.dataset.spinReset)); return; }
    if(t.dataset.spinPick){ openAssignAltModal(t.dataset.spinPick); return; }

    if(t.dataset.newMission!==undefined){ openMissionModal(null); return; }
    if(t.dataset.editMission){ openMissionModal(missionById(t.dataset.editMission)); return; }
    if(t.dataset.deleteMission){ if(confirm('Eliminare questa missione?')) await deleteMission(t.dataset.deleteMission); return; }
    if(t.dataset.suspendMission){ openSuspendModal(missionById(t.dataset.suspendMission)); return; }
    if(t.dataset.assignOccasional){ openAssignOccasionalModal(missionById(t.dataset.assignOccasional)); return; }

    if(t.dataset.newReward!==undefined){ openRewardModal(null); return; }
    if(t.dataset.editReward){ openRewardModal(rewardById(t.dataset.editReward)); return; }
    if(t.dataset.toggleReward){ const r = rewardById(t.dataset.toggleReward); await doc('rewards/'+r.id).update({active:!r.active}); return; }
    if(t.dataset.deleteReward){ if(confirm('Eliminare questo premio?')) await deleteReward(t.dataset.deleteReward); return; }

    if(t.dataset.newChild!==undefined){ openChildModal(null); return; }
    if(t.dataset.editChild){ openChildModal(childById(t.dataset.editChild)); return; }

    if(t.dataset.openCorrection!==undefined){ openCorrectionModal(); return; }

    if(t.dataset.newWheel!==undefined){ openWheelModal(null); return; }
    if(t.dataset.editWheel){ openWheelModal(S.wheelChallenges.find(c=>c.id===t.dataset.editWheel)); return; }
    if(t.dataset.deleteWheel){ if(confirm('Eliminare questa prova?')) await deleteWheelChallenge(t.dataset.deleteWheel); return; }

    if(t.dataset.editTeam!==undefined){ openTeamModal(); return; }
    if(t.dataset.manualContrib!==undefined){ openManualContribModal(); return; }
    if(t.dataset.activateWheelGoal){
      const pool = S.wheelChallenges.filter(c=>c.active).map(c=>c.id);
      if(pool.length===0){ toast('Aggiungi prima qualche prova alla ruota','⚠️'); }
      else { await createSpin(t.dataset.activateWheelGoal, pool); toast('Ruota attivata!','🎡'); }
      return;
    }

    if(t.dataset.changePin!==undefined){ pinMode='change-current'; pinDraft=''; pinError=''; openChangePinModal(); return; }
    if(t.dataset.lockNow!==undefined){ parentUnlocked=false; location.hash='#/parent'; return; }

    if(t.dataset.pinkey){ handlePinKey(t.dataset.pinkey); return; }
  });

  if(route[0]==='parent' && route[1]==='wheel' && parentUnlocked){ mountWheelActivateForm(); }
}

/* --- PIN keypad handling --- */
let pinAutoTimer = null;
async function handlePinKey(k){
  if(pinAutoTimer){ clearTimeout(pinAutoTimer); pinAutoTimer=null; }
  if(k==='clear'){ pinDraft=''; pinError=''; notify(); return; }
  if(k==='back'){ pinDraft = pinDraft.slice(0,-1); pinError=''; notify(); return; }
  if(pinDraft.length>=6) return;
  pinDraft += k;
  notify();
  if(pinDraft.length===6){ await submitPin(); return; }
  if(pinDraft.length>=4){
    pinAutoTimer = setTimeout(()=>{ pinAutoTimer=null; if(pinDraft.length>=4) submitPin(); }, 900);
  }
}

async function submitPin(){
  const hasPin = !!(S.meta && S.meta.parentPinHash);
  if(!hasPin){
    if(pinMode==='create'){
      pinFirstEntry = pinDraft; pinDraft=''; pinMode='confirm'; pinError=''; notify(); return;
    }
    if(pinMode==='confirm'){
      if(pinDraft===pinFirstEntry){
        await setParentPin(pinDraft);
        parentUnlocked = true; pinDraft=''; pinFirstEntry=''; pinMode='create'; pinError='';
        location.hash='#/parent/inbox';
      } else {
        pinError='I PIN non coincidono. Riprova.'; pinDraft=''; pinMode='create'; notify();
      }
      return;
    }
    pinMode='create'; pinDraft=''; notify(); return;
  }
  const ok = await checkParentPin(pinDraft);
  if(ok){ parentUnlocked=true; pinDraft=''; pinError=''; location.hash='#/parent/inbox'; }
  else { pinError='PIN errato. Riprova.'; pinDraft=''; notify(); }
}

    <div class="stack" style="gap:14px">

      </div></div>
      <div class="field"><label>Colore</label><div class="row wrap" style="gap:8px" id="cColorWrap">
        ${AVATAR_COLORS.map(c=>`<button type="button" class="swatch ${child?.color===c?'on':''}" data-color="${c}" style="background:${c}"></button>`).join('')}

      <div class="field"><label>Note su autonomia/difficoltà (facoltativo)</label><textarea id="cNote" placeholder="Es. preferisce missioni più semplici e istruzioni passo passo">${escapeHtml(child?.note||'')}</textarea></div>
      <div class="field"><label>Obiettivo personale di stelle a settimana</label><input type="number" id="cGoal" min="1" value="${child?.weeklyGoal||120}">
        <p class="hint">È un traguardo solo suo: non viene mai confrontato con quello dell'altra bambina.</p>
      </div>
      <button class="btn primary block" id="cSave">Salva profilo</button>
    </div>
  `, (root)=>{
    root.querySelector('[data-close]').onclick = closeModal;
    let avatar = child?.avatar || AVATAR_EMOJI[0];
    let color = child?.color || AVATAR_COLORS[0];
    root.querySelector('#cAvatarWrap').addEventListener('click',(e)=>{
      const b = e.target.closest('[data-emoji]'); if(!b) return;
      avatar = b.dataset.emoji;
      root.querySelectorAll('#cAvatarWrap .emoji-pick').forEach(x=>x.classList.toggle('on', x===b));
    });
    root.querySelector('#cColorWrap').addEventListener('click',(e)=>{
      const b = e.target.closest('[data-color]'); if(!b) return;
      color = b.dataset.color;
      root.querySelectorAll('#cColorWrap .swatch').forEach(x=>x.classList.toggle('on', x===b));
    });
    root.querySelector('#cSave').onclick = async ()=>{
      const name = root.querySelector('#cName').value.trim();
      if(!name){ toast('Inserisci un nome','⚠️'); return; }
      await saveChild({
        name, avatar, color,
        ageYears: root.querySelector('#cAge').value ? Number(root.querySelector('#cAge').value) : null,
        note: root.querySelector('#cNote').value.trim(),
        weeklyGoal: Number(root.querySelector('#cGoal').value)||120,

      }, child?.id);
      closeModal(); toast('Profilo salvato','✅');
    };
  });
}

function openChangePinModal(){
  openModal(`
    <div class="modal-head"><h3>Cambia PIN</h3><button class="icon-btn" data-close>✕</button></div>
    <div class="stack" style="gap:14px">
      <div class="field"><label>PIN attuale</label><input type="password" inputmode="numeric" id="cpCurrent" maxlength="6"></div>
      <div class="field"><label>Nuovo PIN (4-6 cifre)</label><input type="password" inputmode="numeric" id="cpNew" maxlength="6"></div>
      <div class="field"><label>Conferma nuovo PIN</label><input type="password" inputmode="numeric" id="cpConfirm" maxlength="6"></div>
      <p id="cpErr" style="color:var(--danger); font-size:.85rem"></p>
      <button class="btn primary block" id="cpSave">Salva nuovo PIN</button>
    </div>
  `, (root)=>{
    root.querySelector('[data-close]').onclick = closeModal;
    root.querySelector('#cpSave').onclick = async ()=>{
      const cur = root.querySelector('#cpCurrent').value;
      const nw = root.querySelector('#cpNew').value;
      const cf = root.querySelector('#cpConfirm').value;
      const errEl = root.querySelector('#cpErr');
      if(!(await checkParentPin(cur))){ errEl.textContent='PIN attuale errato.'; return; }
      if(nw.length<4){ errEl.textContent='Il nuovo PIN deve avere almeno 4 cifre.'; return; }
      if(nw!==cf){ errEl.textContent='I nuovi PIN non coincidono.'; return; }
      await setParentPin(nw);
      closeModal(); toast('PIN aggiornato','🔒');
    };
  });
}

/* --- Wheel activate form (parent inline, not a modal so it can stay mounted) --- */
function mountWheelActivateForm(){
  const el = document.getElementById('wheelActivateForm');
  if(!el) return;
  const kids = S.children;
  const challenges = S.wheelChallenges.filter(c=>c.active);
  el.innerHTML = `
    <div class="field"><label>Bambina</label><select id="waChild">${kids.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}</select></div>
    <div class="field"><label>Prove tra cui estrarre</label>
      <div class="stack" style="gap:6px">${challenges.map(c=>`<label class="checkrow"><input type="checkbox" data-wpool="${c.id}" checked> ${c.isJoker?'🃏 ':''}${escapeHtml(c.text)}</label>`).join('')}</div>
    </div>
    <button class="btn primary" id="waStart">Attiva la ruota per lei</button>
  `;
  el.querySelector('#waStart').onclick = async ()=>{
    const childId = el.querySelector('#waChild').value;
    const pool = challenges.filter(c=>el.querySelector(`[data-wpool="${c.id}"]`).checked).map(c=>c.id);
    if(pool.length===0){ toast('Seleziona almeno una prova','⚠️'); return; }
    const active = S.wheelSpins.find(s=>s.childId===childId && !['completed','cancelled'].includes(s.status));
    if(active){ toast("C'è già una prova attiva per questa bambina",'⚠️'); return; }
    await createSpin(childId, pool);
    toast('Ruota attivata!','🎡');
  };
}

async function handleSpinClick(spinId, btn){
  const spin = S.wheelSpins.find(s=>s.id===spinId);
  if(!spin || spin.status!=='ready_to_spin') return;
  btn.disabled = true;
  const svg = document.getElementById('wheelSvg');
  const pool = spin.poolChallengeIds.map(id=>S.wheelChallenges.find(c=>c.id===id)).filter(Boolean);
  // pre-compute a big spin rotation for visual flourish while we resolve the real result
  if(svg){ svg.style.transform = `rotate(${1080 + Math.random()*360}deg)`; }
  const chosen = await performSpin(spin);
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(()=>{ notify(); if(chosen){ celebrate(); } }, chosen ? (reduced?150:2700) : 0);
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  const ok = await initDb();
  if(!ok){ render(); return; }
  startSubscriptions();
  try{ await ensureSeed(); }catch(e){ console.warn('seed error', e); }
  render();
}
boot();

})();
